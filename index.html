<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Bar Tales - An AI Adventure</title>
  <script type="module" crossorigin src="/ai-game/assets/index-CY3WPsw8.js"></script>
  <link rel="stylesheet" crossorigin href="/ai-game/assets/index-rTyDDa0I.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="instructions" class="panel">
                <h2>🤠 Western Bar Tales</h2>
                <p><strong>WASD</strong> - Move around</p>
                <p><strong>Mouse</strong> - Look around</p>
                <p><strong>E</strong> - Talk to nearby folks</p>
                <p><strong>ESC</strong> - Exit conversation</p>

                <div id="password-setup">
                    <h3>Enter Password</h3>
                    <p style="font-size: 0.9em; margin: 10px 0;">This game requires a password to play:</p>
                    <input type="password" id="password-input" placeholder="Enter password">
                    <p id="password-status" style="font-size: 0.85em; margin-top: 8px;"></p>
                </div>

                <button id="start-btn">Enter the Saloon</button>
            </div>

            <div id="crosshair"></div>

            <div id="interaction-prompt" class="hidden">
                Press <span class="key">E</span> to talk
            </div>

            <div id="conversation-panel" class="hidden">
                <div id="npc-info">
                    <h3 id="npc-name"></h3>
                    <p id="npc-subtitle"></p>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="What would you like to say?">
                    <button id="send-btn">Send</button>
                </div>
                <div id="conversation-actions">
                    <button id="end-conversation-btn">Walk Away (ESC)</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
