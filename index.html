<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Bar Tales - An AI Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="instructions" class="panel">
                <h2>🤠 Western Bar Tales</h2>
                <p><strong>WASD</strong> - Move around</p>
                <p><strong>Mouse</strong> - Look around</p>
                <p><strong>E</strong> - Talk to nearby folks</p>
                <p><strong>ESC</strong> - Exit conversation</p>

                <div id="token-setup">
                    <h3>AI Setup (Optional)</h3>
                    <p style="font-size: 0.9em; margin: 10px 0;">For real AI conversations, add your GitHub token:</p>
                    <input type="password" id="github-token-input" placeholder="GitHub Token (ghp_...)">
                    <button id="save-token-btn">Save Token</button>
                    <p id="token-status" style="font-size: 0.85em; margin-top: 8px;"></p>
                    <p style="font-size: 0.8em; margin-top: 10px; color: #b8a88a;">
                        Get a token at <a href="https://github.com/settings/tokens" target="_blank" style="color: #d4af37;">github.com/settings/tokens</a><br>
                        with <strong>models:read</strong> permission
                    </p>
                </div>

                <button id="start-btn">Enter the Saloon</button>
            </div>

            <div id="crosshair"></div>

            <div id="interaction-prompt" class="hidden">
                Press <span class="key">E</span> to talk
            </div>

            <div id="conversation-panel" class="hidden">
                <div id="npc-info">
                    <h3 id="npc-name"></h3>
                    <p id="npc-subtitle"></p>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="What would you like to say?">
                    <button id="send-btn">Send</button>
                </div>
                <div id="conversation-actions">
                    <button id="end-conversation-btn">Walk Away (ESC)</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/game.js"></script>
</body>
</html>
